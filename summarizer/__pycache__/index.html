<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Calendar Parser</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }

    #dropZone {
      border: 3px dashed #aaa;
      padding: 40px;
      margin: 20px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    #dropZone.dragover {
      border-color: #007bff;
      background: #f0f8ff;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-top: 20px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <h1>AI Calendar Parser</h1>

  <div id="dropZone">
    <p>Drag & drop a PDF or DOCX file here<br>or click to select</p>
    <input type="file" id="fileInput" accept=".pdf,.docx,.text">
  </div>

  <h2>AI Summary (CSV Format)</h2>
  <textarea id="result" readonly></textarea>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const resultArea = document.getElementById('result');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        handleFileUpload(fileInput.files[0]);
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFileUpload(file);
    });

    async function handleFileUpload(file) {
      resultArea.value = "Processing...";
      const formData = new FormData();
      formData.append('file', file);
    };

    fetch('http://127.0.0.1:5000',{
    method: 'POST',
    body: formData,
    })
    .then(res => res.text())   // just get raw text response
    .then(text => {
    resultArea.value = text; // display it as-is
    })
    .catch(err => {
    resultArea.value = "Request failed: " + err.message;
    });

  </script>
</body>
</html>
