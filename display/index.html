<!DOCTYPE html>
<html lang="en">
<head>

  <title>PDF Syllabus to CSV</title>
  <script src="lib/pdf.min.js"></script>
  <script src="lib/mammoth.browser.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

</html>
