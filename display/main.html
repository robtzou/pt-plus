<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Readable JSON Viewer - Dark Mode</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
    }
    input {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 5px;
      margin-bottom: 10px;
    }
    .data {
      background-color: #1e1e1e;
      border: 1px solid #333;
      padding: 10px;
      margin-top: 10px;
    }
    .pair {
      margin: 5px 0;
    }
    .key {
      font-weight: bold;
      color: #90caf9;
    }
  </style>
</head>
<body>
  <h2>Upload JSON File</h2>
  <input type="file" id="fileInput" accept=".json">
  <div id="output"></div>
  <script src="json.js"></script>
</body>
</html>
